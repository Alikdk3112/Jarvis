<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: Inhalt darf unter Notch und Home-Indikator reichen.
         Den Ausgleich übernimmt env(safe-area-inset-*) im CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070A" />
    <meta name="description" content="Persönliches Cockpit — Habits, Aufgaben, Lernen, Ziele, Journal" />
    <title>JARVIS</title>

    <!-- iOS liest das Manifest nur teilweise und braucht eigene Angaben. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent: die Statusleiste liegt über der App und übernimmt
         deren dunklen Grund, statt als heller Balken darüber zu stehen. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JARVIS" />
    <!-- Ohne dieses Symbol nimmt iOS einen Screenshot der Seite als App-Icon. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

    <!-- Startbilder: ohne sie zeigt iOS beim Öffnen eine weiße Fläche —
         bei einer durchweg dunklen App besonders unangenehm. -->
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1290x2796.png" />
