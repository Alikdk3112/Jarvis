# Prüft jeden Push und veröffentlicht von main auf GitHub Pages.
#
# Der Bau läuft auf GitHubs Runnern, nicht lokal — deshalb müssen die beiden
# Supabase-Werte als Repository-Secrets hinterlegt sein. Fehlen sie, baut die
# App trotzdem, läuft dann aber im lokalen Modus (Daten nur im Browser).
#
# Seit dem Umzug auf Cloudflare Pages (siehe docs/DEPLOY.md) ist die
# Veröffentlichung hier der Rückfallweg, nicht mehr der Hauptweg. Der Bau
# dagegen bleibt für jeden Branch wichtig: er ist der Nachweis, dass Typen und
# Bündel stimmen, bevor irgendwo etwas ausgeliefert wird.
name: Pages

on:
  # Alle Branches, nicht nur zwei namentlich genannte. Vorher stand hier eine
  # Liste, und ein Push auf einen dritten Branch lief still gar nicht durch die
  # Prüfung.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veröffentlichungen gleichzeitig; laufende dürfen fertig werden.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Bauen
        env:
          BASE_PATH: /Jarvis/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Kennzeichen des Baus. Steht danach in den Einstellungen und im
          # Diagnosebericht, damit am Gerät ablesbar ist, welche Fassung läuft.
          BUILD_TIME: ${{ github.run_started_at }}
        run: npm run build

      # GitHub Pages kennt keine Umleitungen: ohne diese Kopie liefert ein
      # direkter Aufruf von /Jarvis/habits einen 404 statt der App. Auf
      # Cloudflare erledigt das public/_redirects richtig, mit Status 200 statt
      # einer Fehlerseite, die vorgibt die App zu sein.
      - name: Tiefe Links ermöglichen
        run: cp dist/index.html dist/404.html

      # Nur hochladen, was auch veröffentlicht wird. Auf einem Branch endet der
      # Lauf hier — mit grünem Bau und ohne den Anschein, ausgeliefert zu haben.
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # Veröffentlichen kann nur der Standardbranch.
  #
  # Die Umgebung `github-pages` ist auf main beschränkt, und `deploy-pages`
  # bricht auf jedem anderen Branch nach zwei Sekunden ab. Diese Bedingung war
  # nicht da — mit der Folge, dass jeder Push auf den Arbeitsbranch brav baute,
  # dann rot wurde, und der Eindruck entstand, es sei ausgeliefert. Ein Fix lag
  # so wochenlang gebaut und unveröffentlicht herum, während am Telefon der
  # alte Stand lief.
  #
  # Jetzt ist das ehrlich: auf einem Branch läuft nur der Bau — er beweist,
  # dass Typen und Bündel in Ordnung sind — und das Veröffentlichen wird
  # übersprungen statt zu scheitern.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
